name: Android 14 emulator smoke test
on:
  push:
    paths:
      - .github/workflows/emulator.yml
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build run containing the APK artifact to test
        default: '39871994221'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download original APK build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run || '39871994221' }}
          name: 2048-debug-apk
          path: input
      - run: sha256sum input/*.apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 14 and exercise launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: python3 scripts/emulator-smoke.py input test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android14-smoke-results
          path: test-results/
          if-no-files-found: warn
