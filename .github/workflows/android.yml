name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install upstream SDK requirements
        run: sdkmanager 'platforms;android-26' 'platforms;android-35' 'build-tools;34.0.0'
      - name: Check puzzle rules
        run: scripts/check-puzzle.sh
      - name: Build complete APK
        run: ./gradlew --no-daemon :assembly:assembleCompleteFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 2048-debug-apk
          path: assembly/build/outputs/apk/completeFdroid/debug/*.apk
          if-no-files-found: error
  emulator:
    needs: apk
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra_profile: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 2048-debug-apk
          path: input
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android 14 launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: python3 scripts/emulator-smoke.py input test-results
        env:
          EXTRA_PROFILE: ${{ matrix.extra_profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android14-smoke-profile-${{ matrix.extra_profile }}
          path: test-results/
          if-no-files-found: warn
